<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Directorio de Contactos - Vercel & AWS RDS</title>
    <style>
        table { border-collapse: collapse; width: 60%; margin: 20px auto; font-family: Arial, sans-serif; }
        th, td { border: 1px solid #dddddd; text-align: left; padding: 8px; }
        th { background-color: #4CAF50; color: white; }
        h2 { text-align: center; font-family: Arial, sans-serif; }
        .mensaje-cargas { text-align: center; font-family: Arial, sans-serif; color: #666; }
    </style>
</head>
<body>
    <h2>Lista de Contactos (Obtenida desde AWS RDS vía Vercel)</h2>
    
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Teléfono</th>
                <th>Email</th>
            </tr>
        </thead>
        <tbody id="tabla-contactos">
            <tr>
                <td colspan="4" class="mensaje-cargas">Cargando contactos de la base de datos...</td>
            </tr>
        </tbody>
    </table>

    <script>
    fetch('/api/contactos')
        .then(response => response.json())
        .then(contactos => {
            const tbody = document.getElementById('tabla-contactos');
            tbody.innerHTML = '';

            const lista = Array.isArray(contactos) ? contactos : (contactos.data || []);

            if (lista.length > 0) {
                lista.forEach((c, index) => {
                    const tr = document.createElement('tr');
                    
                    // Mapeo flexible para ID
                    const id = c.ContactoID || c.id_contacto || c.ID || c.id || (index + 1);

                    // Mapeo flexible para Nombre
                    const nombre = c.Nombre || c.nombre || c.nombre_contacto || c.NombreContacto || c.name || '-';

                    // Mapeo flexible para Teléfono
                    const telefono = c.Telefono || c.telefono || c.telefono_contacto || c.TelefonoContacto || c.phone || '-';

                    // Mapeo flexible para Email
                    const email = c.Email || c.email || c.email_contacto || c.EmailContacto || c.correo || c.Correo || '-';

                    tr.innerHTML = `
                        <td>${id}</td>
                        <td>${nombre}</td>
                        <td>${telefono}</td>
                        <td>${email}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                tbody.innerHTML = '<tr><td colspan="4" class="mensaje">No hay contactos disponibles.</td></tr>';
            }
        })
        .catch(error => {
            console.error('Error al conectar con la API:', error);
            document.getElementById('tabla-contactos').innerHTML = 
                '<tr><td colspan="4" class="mensaje" style="color: red;">Error al consultar los contactos.</td></tr>';
        });
</script>
</body>
</html>
